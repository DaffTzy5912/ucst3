<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cari Video TikTok</title>
  <link rel="stylesheet" href="public/style.css">
</head>
<body>
  <div class="container">
    <h1>Cari Video TikTok</h1>
    <input type="text" id="searchInput" placeholder="Masukkan kata kunci...">
    <button onclick="searchTikTok()">Cari</button>
    <div id="results"></div>
  </div>

  <script>
    async function searchTikTok() {
      const query = document.getElementById('searchInput').value;
      const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
      const data = await response.json();

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (data && data.result) {
        data.result.forEach(video => {
          const videoElement = document.createElement('div');
          videoElement.innerHTML = `
            <h3>${video.title}</h3>
            <video src="${video.video}" controls width="300"></video>
            <p>User: ${video.username}</p>
            <hr>
          `;
          resultsDiv.appendChild(videoElement);
        });
      } else {
        resultsDiv.innerHTML = '<p>Hasil tidak ditemukan.</p>';
      }
    }
  </script>
</body>
</html>
