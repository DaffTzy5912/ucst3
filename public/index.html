<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search TikTok Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f2f2f2;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      max-width: 400px;
    }
    .video-container {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .video-item {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .video-item video {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <h1>Cari Video TikTok</h1>
  <input type="text" id="searchInput" placeholder="Cari video..." />
  <button onclick="searchVideos()">Cari</button>

  <div class="video-container" id="videoContainer"></div>

  <script>
    async function searchVideos() {
      const query = document.getElementById("searchInput").value;
      const container = document.getElementById("videoContainer");
      container.innerHTML = "Loading...";
      
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!data || !data.data || data.data.length === 0) {
          container.innerHTML = "Tidak ada hasil ditemukan.";
          return;
        }

        container.innerHTML = "";
        data.data.forEach(video => {
          const item = document.createElement("div");
          item.className = "video-item";
          item.innerHTML = `
            <video controls>
              <source src="${video.video}" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = "Terjadi kesalahan saat memuat video.";
      }
    }
  </script>

</body>
</html>
